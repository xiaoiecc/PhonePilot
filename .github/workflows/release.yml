name: PhonePilot checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install compile platform and build tools
      run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

    - name: Fetch and verify the pinned Mihomo executable
      shell: pwsh
      run: ./scripts/fetch-mihomo.ps1

    - name: Run tests, architecture checks, build and lint
      run: bash ./gradlew :automation-core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: PhonePilot-check-reports
        path: |
          automation-core/build/reports/tests/
          app/build/reports/tests/
          app/build/reports/lint-results-debug.*
        if-no-files-found: ignore

    - name: Upload CI debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PhonePilot-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
